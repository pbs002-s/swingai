# Edge box stack: Mosquitto + collector + vision. Raw video never leaves this box.
# Setup: cp .env.example .env, create mosquitto/passwd (see README), then: docker compose up -d
services:
  mosquitto:
    image: eclipse-mosquitto:2
    restart: unless-stopped
    ports: ["1883:1883"]  # sensor VLAN only; do not expose to the internet
    volumes:
      - ./mosquitto/mosquitto.conf:/mosquitto/config/mosquitto.conf:ro
      - ./mosquitto/passwd:/mosquitto/config/passwd:ro
      - mqtt-data:/mosquitto/data

  # Live view for browsers on the factory LAN only. Never forward these ports to the internet.
  go2rtc:
    image: alexxit/go2rtc:1.9.9
    restart: unless-stopped
    environment:
      GO2RTC_USER: ${GO2RTC_USER:-viewer}
      GO2RTC_PASSWORD: ${GO2RTC_PASSWORD:?set GO2RTC_PASSWORD in .env (the live view password)}
    volumes: [./go2rtc.yaml:/config/go2rtc.yaml:ro]
    ports:
      - "1984:1984"  # player + API (the collector registers cameras here)
      - "8555:8555"  # WebRTC media (tcp + udp)
      - "8555:8555/udp"

  collector:
    build: .
    restart: unless-stopped
    depends_on: [mosquitto, go2rtc]
    env_file: .env
    environment:
      GO2RTC_URL: http://go2rtc:1984
      GO2RTC_USER: ${GO2RTC_USER:-viewer}
      GO2RTC_PASSWORD: ${GO2RTC_PASSWORD}
      MQTT_HOST: mosquitto
      OUTBOX_PATH: /data/outbox.sqlite3
    volumes: [edge-data:/data]

  vision:
    build: {context: ., dockerfile: Dockerfile.vision}
    restart: unless-stopped
    depends_on: [mosquitto, collector]
    env_file: .env
    environment:
      MQTT_HOST: mosquitto
      OUTBOX_PATH: /data/outbox.sqlite3  # same outbox as the collector (SQLite WAL)
      EVIDENCE_DIR: /data
      SS_DETECTOR_MODEL: /models/yolox_s.onnx
      SS_POSE_MODEL: /models/pose_landmarker_lite.task
    command: ["--config", "/config/camera.json", "--source", "${CAMERA_RTSP_URL:?set CAMERA_RTSP_URL in .env}"]
    volumes:
      - edge-data:/data
      - ./models:/models:ro
      - ./config:/config:ro

volumes:
  mqtt-data:
  edge-data:
