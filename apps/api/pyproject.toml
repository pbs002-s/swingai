[project]
name = "stitchsense-api"
version = "0.1.0"
description = "StitchSense API"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.20.1",
    "argon2-cffi>=23",
    "asyncpg>=0.32.0",
    "fastapi>=0.115",
    "pydantic>=2.9",
    "pydantic-settings>=2.16.3",
    "python-multipart>=0.0.34",
    "sqlalchemy[asyncio]>=2.0.36",
    "tzdata>=2026.6",
    "uvicorn[standard]>=0.32",
]


[dependency-groups]
dev = [
    "aiosqlite>=0.22.1",
    "httpx>=0.28.1",
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "ruff>=0.17.5",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "session"
asyncio_default_test_loop_scope = "session"
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 130
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "S", "ASYNC"]
ignore = ["S101", "B008"]

[tool.ruff.lint.per-file-ignores]
"app/simulator/*" = ["S311", "S105"]
"tests/*" = ["S105", "S106", "S311", "E501"]

[tool.coverage.run]
concurrency = ["greenlet", "thread"]
source = ["app"]
