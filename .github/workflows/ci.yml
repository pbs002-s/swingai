name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  api:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stitchsense
          POSTGRES_PASSWORD: stitchsense
          POSTGRES_DB: stitchsense_test
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U stitchsense" --health-interval 5s --health-retries 10
    defaults:
      run:
        working-directory: apps/api
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --frozen
      - run: uv run ruff check app tests
      - run: uv run ruff format --check app
      - run: uv run pytest --cov=app --cov-fail-under=80

  web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npx eslint src e2e
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run build

  e2e:
    needs: [api, web]
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: stitchsense
          POSTGRES_PASSWORD: stitchsense
          POSTGRES_DB: stitchsense
        ports: ["5433:5432"]
        options: --health-cmd "pg_isready -U stitchsense" --health-interval 5s --health-retries 10
    env:
      SS_ENV: development
      SS_DATABASE_URL: postgresql+asyncpg://stitchsense:stitchsense@localhost:5433/stitchsense
      SS_SIMULATOR_ENABLED: "true"
      SS_SEED_DEMO: "true"
      SS_LOGIN_RATE_PER_MINUTE: "200"
      NEXT_PUBLIC_DEMO: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/web/package-lock.json
      - name: Start API
        working-directory: apps/api
        run: |
          uv sync --frozen
          uv run alembic upgrade head
          nohup uv run uvicorn app.main:app --port 8000 > api.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:8000/api/v1/healthz && break; sleep 1; done
      - name: Build and start web
        working-directory: apps/web
        run: |
          npm ci
          npx playwright install --with-deps chromium
          npm run build
          nohup npx next start -p 3100 > web.log 2>&1 &
          for i in $(seq 1 60); do curl -sf localhost:3100/ > /dev/null && break; sleep 1; done
      - name: Playwright
        working-directory: apps/web
        run: npx playwright test --project=desktop --project=mobile
        env:
          PW_CHANNEL: chromium
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report
